# Generated from Uptime Kuma export by kuma_to_gatus.py
# Secrets come from environment variables. Set before starting Gatus:
#   MATTERMOST_WEBHOOK_URL

web:
  port: 8080

ui:
  title: "s9t Status"
  header: "s9t Status"
  default-sort-by: group

storage:
  type: sqlite
  path: /data/data.db

alerting:
  mattermost:
    webhook-url: "http://192.168.2.127:8065/hooks/dwf7zg1wc3bd98qhxw1wwqkzgy"
    default-alert:
      # Kuma had 0 retries, so it alerted on the first failure.
      # Raise this to 2 or 3 if that turns out to be noisy.
      failure-threshold: 1
      success-threshold: 1
      send-on-resolved: true

endpoints:

  # --- Home Automation ---
  - name: "Caseta PRO Hub"
    group: "Home Automation"
    url: "icmp://192.168.2.88"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: mattermost
  - name: "Home Assistant (Local)"
    group: "Home Automation"
    url: "http://192.168.2.19:8123"
    interval: 60s
    conditions:
      - "[STATUS] < 300"
    alerts:
      - type: mattermost
  - name: "Home Assistant (Public)"
    group: "Home Automation"
    url: "https://home.s9t.org"
    interval: 60s
    conditions:
      - "[STATUS] < 300"
      - "[CERTIFICATE_EXPIRATION] > 240h"
